<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thống kê NSCN</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <style id="page-size">@page { size: A5 landscape; margin: 0; }</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <img class="brand-logo" src="assets/logo.png" alt="Nghĩa Sơn">
      <div class="brand-text">
        <h1>Thống kê – Nghĩa Sơn Chi Nhánh</h1>
        <p>Lệnh sản xuất đang chạy · sản phẩm · cụm · chi tiết · phiếu pallet</p>
      </div>
      <div class="sync">
        <span id="sync-status" class="sync-status">Đang tải dữ liệu…</span>
        <button id="btn-refresh" class="btn" type="button" title="Đọc lại dữ liệu mới nhất từ Google Sheet">⟳ Làm mới</button>
      </div>
    </header>

    <section class="filters" aria-label="Tìm kiếm và lọc">
      <div class="search">
        <input id="q" type="search" placeholder="Tìm LSX, sản phẩm, mã SP, cụm, chi tiết, mã phiếu (quét QR)…" autocomplete="off">
      </div>
      <div class="filter-row">
        <label>LSX <select id="f-mo"></select></label>
        <label>Khách hàng <select id="f-customer"></select></label>
        <label>Sản phẩm <select id="f-product"></select></label>
        <label>Loại <select id="f-kind"></select></label>
        <label>Nhóm CĐ <select id="f-group"></select></label>
        <label>Công đoạn <select id="f-stage"></select></label>
        <label>Trạng thái <select id="f-status"></select></label>
        <label class="chk"><input id="f-running" type="checkbox" checked> Chỉ LSX đang chạy</label>
        <button id="btn-clear" class="btn btn-ghost" type="button">Xoá lọc</button>
      </div>
      <div class="result-row">
        <span id="result-count"></span>
        <span class="spacer"></span>
        <button id="btn-expand" class="btn btn-ghost" type="button">Mở tất cả</button>
        <button id="btn-collapse" class="btn btn-ghost" type="button">Thu gọn</button>
        <button id="btn-select-all" class="btn" type="button">Chọn tất cả phiếu đang lọc</button>
      </div>
    </section>

    <main id="tree" class="tree" aria-live="polite"></main>

    <div id="selbar" class="selbar" hidden>
      <span><b id="sel-count">0</b> phiếu đã chọn</span>
      <span class="spacer"></span>
      <button id="btn-sel-clear" class="btn btn-ghost" type="button">Bỏ chọn</button>
      <button id="btn-preview" class="btn btn-primary" type="button">Xem &amp; in phiếu</button>
    </div>
  </div>

  <div id="preview" class="preview" hidden>
    <div class="pv-toolbar">
      <b id="pv-title">Xem trước</b>
      <label>Khổ giấy
        <select id="pv-paper">
          <option value="a5">A5 ngang – 1 phiếu/tờ</option>
          <option value="a4">A4 dọc – 2 phiếu/tờ</option>
        </select>
      </label>
      <label>Thứ tự
        <select id="pv-sort">
          <option value="part">Theo LSX → SP → chi tiết → bước</option>
          <option value="stage">Theo tổ → công đoạn (chia cho từng tổ)</option>
        </select>
      </label>
      <label title="Số pallet của mỗi công đoạn: in n bản, tự đánh số Pallet 1/n … n/n">Số pallet/phiếu
        <input id="pv-copies" type="number" min="1" max="20" value="1">
      </label>
      <span class="spacer"></span>
      <button id="pv-close" class="btn btn-ghost" type="button">Đóng</button>
      <button id="pv-print" class="btn btn-primary" type="button">🖨 In</button>
    </div>
    <div id="print-pages" class="print-pages"></div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
